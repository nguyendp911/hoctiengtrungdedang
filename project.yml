name: HanziLock
options:
  bundleIdPrefix: com.nguyendp
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    # Điền Team ID của bạn (Xcode > Settings > Accounts) hoặc chọn Team trong Xcode
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
targets:
  HanziLock:
    type: application
    platform: iOS
    scheme: {}
    sources:
      - App
      - Shared
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Hán Tự
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSMicrophoneUsageDescription: Hán Tự dùng micro để nghe bạn đọc và chấm điểm phát âm.
        NSSpeechRecognitionUsageDescription: Hán Tự nhận dạng giọng nói để so với câu mẫu khi luyện nói.
        CFBundleURLTypes:
          - CFBundleURLName: com.nguyendp.hanzilock
            CFBundleURLSchemes: [hanzilock]
    entitlements:
      path: App/HanziLock.entitlements
      properties:
        com.apple.security.application-groups: [group.com.nguyendp.hanzilock]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nguyendp.hanzilock
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - target: HanziWidget
        embed: true

  HanziWidget:
    type: app-extension
    platform: iOS
    sources:
      - Widget
      - Shared
    info:
      path: Widget/Info.plist
      properties:
        CFBundleDisplayName: Hán Tự
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Widget/HanziWidget.entitlements
      properties:
        com.apple.security.application-groups: [group.com.nguyendp.hanzilock]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nguyendp.hanzilock.widget
