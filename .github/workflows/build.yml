name: Build iOS

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build (unsigned)
        run: |
          set -o pipefail
          xcodebuild \
            -project HanziLock.xcodeproj \
            -scheme HanziLock \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package IPA
        run: |
          APP=build/Build/Products/Release-iphoneos/HanziLock.app
          # Ký ad-hoc chỉ để nhúng entitlements (App Group) vào file;
          # Sideloadly sẽ ký lại bằng Apple ID và giữ các quyền này
          codesign -f -s - --entitlements Widget/HanziWidget.entitlements "$APP/PlugIns/HanziWidget.appex"
          codesign -f -s - --entitlements App/HanziLock.entitlements "$APP"
          codesign -d --entitlements - "$APP"
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry HanziLock-unsigned.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: HanziLock-unsigned-ipa
          path: HanziLock-unsigned.ipa
