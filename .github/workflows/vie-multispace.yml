name: Build Vie MultiSpace IPA

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "VieMultiSpace/**"
      - ".github/workflows/vie-multispace.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Vie MultiSpace project
        working-directory: VieMultiSpace
        run: xcodegen generate

      - name: Build unsigned iOS app
        run: |
          set +e
          xcodebuild \
            -project VieMultiSpace/VieMultiSpace.xcodeproj \
            -scheme VieMultiSpace \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$GITHUB_WORKSPACE/build-vie" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build > build.log 2>&1
          STATUS=$?
          if [ $STATUS -ne 0 ]; then
            echo "========== COMPILATION ERRORS =========="
            grep -E "error:" build.log || true
            echo "========== LAST 50 LINES =========="
            tail -n 50 build.log
            exit $STATUS
          fi

      - name: Package IPA for Sideloadly
        run: |
          set -e
          APP="$GITHUB_WORKSPACE/build-vie/Build/Products/Release-iphoneos/VieMultiSpace.app"
          test -d "$APP"
          codesign -f -s - "$APP"
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry VieMultiSpace-unsigned.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: VieMultiSpace-unsigned-ipa
          path: VieMultiSpace-unsigned.ipa
          if-no-files-found: error
